name: Generate Swagger documentation & LLVM-Cov coverage report.

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # PostgreSQL service needed so cargo-llvm-cov can run tests that hit the database
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
  
      - name: Install sqlx-cli
        run: cargo install sqlx-cli --no-default-features --features rustls,postgres

      - name: Run Database Migrations
        run: cargo sqlx migrate run
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db

      - name: Verify SQLx Cache (optional, matches ci.yml)
        run: cargo sqlx prepare --workspace --check
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db

      - name: Generate swagger-endpoints.json
        run: |
          EXPORT_OPENAPI=1 cargo run

      - name: Generate code coverage HTML report
        env:
          DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db
        run: cargo llvm-cov --html --output-dir target/llvm-cov/html

      - name: Organize files for deployment
        run: |
          # Directorio para almacenar los archivos de documentación y cobertura
          mkdir -p public/swagger public/coverage

          # Elementos de json movemos a la carpeta swagger
          mv swagger-endpoints.json public/swagger/

          # Elementos de cobertura movemos a la carpeta coverage
          cp -r target/llvm-cov/html/* public/coverage/

          # Creamos el landing
          cat << 'EOF' > public/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>FinanciAr - Documentation & Reports</title>
              <style>
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
                      background-color: #0f172a;
                      color: #f8fafc;
                      display: flex;
                      justify-content: center;
                      align-items: center;
                      height: 100vh;
                      margin: 0;
                  }
                  .container {
                      background-color: #1e293b;
                      padding: 2.5rem;
                      border-radius: 12px;
                      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
                      text-align: center;
                      max-width: 400px;
                      width: 100%;
                  }
                  h1 { margin-bottom: 0.5rem; font-size: 1.5rem; color: #38bdf8; }
                  p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 2rem; }
                  .btn-group { display: flex; flex-direction: column; gap: 1rem; }
                  .btn {
                      background-color: #2563eb;
                      color: white;
                      padding: 0.75rem 1rem;
                      border-radius: 6px;
                      text-decoration: none;
                      font-weight: 600;
                      transition: background-color 0.2s;
                  }
                  .btn:hover { background-color: #1d4ed8; }
                  .btn-secondary { background-color: #334155; }
                  .btn-secondary:hover { background-color: #475569; }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>FinanciAr Portal</h1>
                  <p>Documentación de métricas y Swagger (endpoints API)</p>
                  <div class="btn-group">
                      <a href="./swagger/" class="btn">Click para ir al Swagger</a>
                      <a href="./coverage/index.html" class="btn btn-secondary">Click para ir al Code Coverage (LLVM-Cov)</a>
                  </div>
              </div>
          </body>
          </html>
          EOF

          # Creamos el Swagger UI 
          cat << 'EOF' > public/swagger/index.html
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>API Documentation</title>
            <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui.css" />
          </head>
          <body>
            <div id="swagger-ui"></div>
            <script src="https://unpkg.com/swagger-ui-dist@5.11.0/swagger-ui-bundle.js"></script>
            <script>
              window.onload = () => {
                window.ui = SwaggerUIBundle({
                  url: "./swagger-endpoints.json",
                  dom_id: '#swagger-ui',
                  deepLinking: true,
                  presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIBundle.SwaggerUIStandalonePreset
                  ],
                });
              };
            </script>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages