<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanciAr - Documentation & Reports</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { margin-bottom: 0.5rem; font-size: 1.5rem; color: #38bdf8; }
        p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 2rem; }
        .btn-group { display: flex; flex-direction: column; gap: 1rem; }
        .btn {
            background-color: #2563eb;
            color: white;
            padding: 0.75rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .btn:hover { 
            background-color: #1d4ed8; 
            transform: translateY(-2px);
            box-shadow: 0 6px 12px -2px rgba(37, 99, 235, 0.3);
        }
        .btn-secondary { background-color: #334155; }
        .btn-secondary:hover { 
            background-color: #475569; 
            transform: translateY(-2px);
            box-shadow: 0 6px 12px -2px rgba(51, 65, 85, 0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>FinanciAr Portal</h1>
        <p>Documentación de métricas y Swagger (endpoints API)</p>
        <div class="btn-group">
            <a href="./swagger/" class="btn">Click para ir al Swagger</a>
            <a href="./coverage/index.html" class="btn btn-secondary">Click para ir al Code Coverage (LLVM-Cov)</a>
        </div>
    </div>
</body>
</html>
